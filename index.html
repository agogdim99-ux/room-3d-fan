<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영상 하나로 만든 3D 장면</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;color:#e2e8f0;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #c{display:block;width:100%;height:100%;touch-action:none}
  .panel{position:fixed;background:rgba(11,15,20,.88);border:1px solid #1e293b;
    border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;backdrop-filter:blur(6px)}
  #hud{left:12px;top:12px;max-width:min(320px,calc(100vw - 24px))}
  #hud h1{margin:0 0 4px;font-size:14px;color:#7dd3fc;font-weight:600}
  #steps{margin:0;padding:0;list-style:none}
  #steps li{color:#64748b}
  #steps li::before{display:inline-block;width:2.4em;font-weight:700;content:""}
  #steps li.run::before{content:"..";color:#eab308}
  #steps li.ok{color:#86efac}  #steps li.ok::before{content:"OK";color:#22c55e}
  #steps li.bad{color:#fca5a5} #steps li.bad::before{content:"X";color:#ef4444}
  #fix{margin-top:8px;padding:8px;border-radius:8px;background:#2a1215;border:1px solid #7f1d1d;
    color:#fecaca;display:none;white-space:pre-wrap}
  #fix.show{display:block}
  #ctl{right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;
    max-width:calc(100vw - 24px)}
  button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;
    padding:7px 11px;font-size:12.5px;cursor:pointer}
  button:hover{background:#334155}
  button.on{background:#0369a1;border-color:#0ea5e9}
  #hide{position:absolute;right:6px;top:4px;padding:0 6px;border:0;background:none;color:#64748b}
  #drop{position:fixed;inset:12px;border:3px dashed #38bdf8;border-radius:16px;display:none;
    align-items:center;justify-content:center;background:rgba(11,15,20,.6);font-size:18px;color:#7dd3fc;
    pointer-events:none}
  #drop.show{display:flex}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="drop">여기에 놓으면 지금 시점 그대로 바꿔 보여 줍니다 (.sog .spz .ply .compressed.ply)</div>

<div class="panel" id="hud">
  <button id="hide" title="접기">–</button>
  <h1>영상 하나로 만든 3D 장면</h1>
  <ul id="steps">
    <li id="s1">라이브러리 불러오기</li>
    <li id="s2">렌더러 넣기</li>
    <li id="s3">파일 받기</li>
    <li id="s4">알갱이로 풀기</li>
    <li id="s5">크기 재기</li>
  </ul>
  <div id="fix"></div>
</div>

<div class="panel" id="ctl">
  <button id="open" title=".sog .spz .ply .compressed.ply 를 끌어다 놓거나 골라서 같은 시점에서 비교">파일 열기</button>
  <input type="file" id="file" accept=".sog,.spz,.ply,.splat,.ksplat" hidden>
  <button id="home">촬영 위치로</button>
  <button id="fit">전체 보기</button>
  <button id="flip">위아래 뒤집기</button>
  <button id="spin">자동 회전</button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
}}
</script>
<script type="module">
/* ============ 여기만 고치면 됩니다 ============ */
let SPLAT_FILE = "scene.sog";   // 같은 폴더의 .sog / .ply / .splat / .spz
/* 첫 사진을 찍은 카메라 자리와 바라본 곳 (room_points.npz 의 cam_pos, cam_dir 에서 y·z 를 뒤집은 값) */
const HOME_POS    = [0, 0, 0];
const HOME_TARGET = [0.058, -0.018, -1.179];   // 모든 카메라 시선이 모이는 곳 = 가운데 물건
/* ============================================= */
SPLAT_FILE = new URLSearchParams(location.search).get("f") || SPLAT_FILE;   // ?f=다른파일 로 비교

const el = id => document.getElementById(id);
const mark = (id, cls, text) => { el(id).className = cls; if (text) el(id).textContent = text; };
function fail(msg) { const f = el("fix"); f.classList.add("show"); f.textContent = "막혔습니다\n" + msg; }
addEventListener("error", e => fail("자바스크립트 오류: " + (e?.message ?? e)));
addEventListener("unhandledrejection", e => fail("처리 못 한 실패: " + (e.reason?.message || e.reason)));
el("hide").onclick = () => { const s = el("steps").style; s.display = s.display ? "" : "none"; };

// 1. 라이브러리
mark("s1", "run");
let THREE, OrbitControls, SPARK;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  SPARK = await import("@sparkjsdev/spark");
  mark("s1", "ok", `라이브러리 불러오기 (three r${THREE.REVISION}, Spark 2.4.0)`);
} catch (e) {
  mark("s1", "bad"); fail("three.js 나 Spark 를 못 불러왔습니다. 인터넷 연결을 확인하세요.\n" + e.message); throw e;
}

const renderer = new THREE.WebGLRenderer({ canvas: el("c"), antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// 2. 렌더러: SparkRenderer 를 장면에 넣지 않으면 오류 없이 화면이 까맣다
const spark = new SPARK.SparkRenderer({ renderer });
scene.add(spark);
mark("s2", "ok", "렌더러 넣기 (SparkRenderer)");

// 확장자 → Spark 안쪽 형식 이름. .sog 는 pcsogszip, .compressed.ply 도 Spark 에서는 ply
const TYPE_OF = { "compressed.ply": "ply", sog: "pcsogszip", ply: "ply", splat: "splat", ksplat: "ksplat", spz: "spz" };
function typeOf(name) {
  const n = name.toLowerCase();
  const key = Object.keys(TYPE_OF).find(k => n.endsWith("." + k));
  if (!key) throw new Error(`모르는 확장자입니다: ${name} (sog, spz, ply, compressed.ply, splat, ksplat)`);
  return { key, type: TYPE_OF[key] };
}

let mesh = null, box = null, radius = 1, flipped = false;

// 4·5. 알갱이로 풀고 크기 재기. 다른 파일을 넣어도 카메라는 그대로 두어 같은 시점에서 비교한다
async function showSplat(name, bytes) {
  mark("s4", "run", "알갱이로 풀기");
  const { key, type } = typeOf(name);
  const t0 = performance.now();
  const next = new SPARK.SplatMesh({ fileBytes: bytes, fileType: type });
  await next.initialized;
  const n = next.packedSplats?.numSplats ?? next.numSplats ?? 0;
  if (!n) throw new Error("알갱이가 0개입니다");
  if (flipped) { next.scale.y = -1; next.scale.z = -1; }
  if (mesh) { scene.remove(mesh); mesh.dispose?.(); }
  mesh = next; scene.add(mesh); window.room3d && (window.room3d.mesh = mesh);
  mark("s4", "ok", `알갱이 ${n.toLocaleString("ko-KR")}개 · ${((performance.now() - t0) / 1000).toFixed(1)}초 · ` +
                   `${(bytes.byteLength / n).toFixed(1)}바이트/개 (${key}→${type})`);
  // Box3.setFromObject 는 SplatMesh 에 빈 상자를 준다 → Spark 의 getBoundingBox
  let b = null;
  try { b = mesh.getBoundingBox(true); } catch (e) {}
  if (!b || b.isEmpty()) {
    mark("s5", "bad"); fail("Spark 로 크기를 못 쟀습니다. 손으로 끌어서 찾으세요.");
    b = new THREE.Box3(new THREE.Vector3(-2, -2, -2), new THREE.Vector3(2, 2, 2));
  } else {
    const sz = b.getSize(new THREE.Vector3());
    mark("s5", "ok", `크기 재기 ${sz.x.toFixed(2)} × ${sz.y.toFixed(2)} × ${sz.z.toFixed(2)}`);
  }
  box = b; radius = box.getSize(new THREE.Vector3()).length() / 2;
  camera.near = Math.max(radius / 2000, 0.001); camera.far = radius * 50; camera.updateProjectionMatrix();
  controls.maxDistance = radius * 6;
  document.title = `${name} · 3D 장면`;
  return n;
}

// 3. 파일 받기
mark("s3", "run");
let bytes;
try {
  const t0 = performance.now();
  const r = await fetch(SPLAT_FILE);
  if (!r.ok) throw new Error(`서버 응답 ${r.status}`);
  bytes = new Uint8Array(await r.arrayBuffer());
  const s = ((performance.now() - t0) / 1000).toFixed(1);
  mark("s3", "ok", `파일 받기 ${SPLAT_FILE} ${(bytes.byteLength / 1e6).toFixed(1)}MB · ${s}초`);
} catch (e) {
  mark("s3", "bad");
  fail(`"${SPLAT_FILE}" 를 못 받았습니다 (${e.message}).\n같은 폴더에 있는지, file:// 로 열지 않았는지, 주소 뒤에 /${SPLAT_FILE} 를 붙여 내려오는지 보세요.`);
  throw e;
}
try { await showSplat(SPLAT_FILE, bytes); }
catch (e) { mark("s4", "bad"); fail("알갱이로 못 풀었습니다. " + e.message); throw e; }

// 파일 끌어다 놓기 (또는 '파일 열기' 단추) → 지금 시점 그대로 바꿔 보여 준다
async function openLocal(file) {
  try {
    const t0 = performance.now();
    const b = new Uint8Array(await file.arrayBuffer());
    mark("s3", "ok", `파일 열기 ${file.name} ${(b.byteLength / 1e6).toFixed(1)}MB (${b.byteLength.toLocaleString("ko-KR")}바이트) · ` +
                     `${((performance.now() - t0) / 1000).toFixed(1)}초`);
    el("fix").classList.remove("show");
    await showSplat(file.name, b);
  } catch (e) { mark("s4", "bad"); fail(`${file.name} 를 못 열었습니다. ${e.message}`); }
}
addEventListener("dragover", e => { e.preventDefault(); el("drop").classList.add("show"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) el("drop").classList.remove("show"); });
addEventListener("drop", e => {
  e.preventDefault(); el("drop").classList.remove("show");
  const f = e.dataTransfer.files[0]; if (f) openLocal(f);
});
el("open").onclick = () => el("file").click();
el("file").onchange = e => { const f = e.target.files[0]; if (f) openLocal(f); e.target.value = ""; };

function goHome() {   // 촬영 위치 근처에서 시작
  camera.position.fromArray(HOME_POS); controls.target.fromArray(HOME_TARGET);
  camera.position.lerp(controls.target, 0.02);   // 타깃과 겹치지 않게 살짝만 당김
  controls.update();
}
function fitAll() {   // Spark 로 잰 상자에 맞춰 바깥에서 전체 보기
  const c = box.getCenter(new THREE.Vector3());
  const d = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.9;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0.45, 0.35, 0.82).normalize().multiplyScalar(d));
  controls.update();
}
goHome();

el("home").onclick = goHome;
el("fit").onclick = fitAll;
el("flip").onclick = () => {
  flipped = !flipped; mesh.scale.y *= -1; mesh.scale.z *= -1; mesh.updateMatrixWorld(true);
};
el("spin").onclick = e => {
  controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 0.8;
  e.target.classList.toggle("on", controls.autoRotate);
};
window.room3d = { THREE, SPARK, scene, camera, controls, renderer, spark, mesh, box, openLocal, showSplat };

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
